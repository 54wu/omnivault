version: 2

builds:
  - main: ./cmd/omnivault
    binary: omnivault
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # rsrc_windows_amd64.syso carries the icon/version on windows/amd64 via its
    # file-name build tag, so no extra hook is needed. Other GOOS/GOARCH
    # combinations simply ignore it. arm64 for windows is rare; skip it.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: main
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
  # 额外发布单 exe：Windows 直接得 OmniVault-Windows-x64.exe 下载即用（arm64 已忽略），其余平台保留原样
  - id: bare
    name_template: |-
      {{- if eq .Os "windows" -}}OmniVault-Windows-x64{{- else -}}{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{- end -}}
    format: binary

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: 54wu
    name: omnivault